---
name: Shellcheck

# Controls when the workflow will run
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get install -qy shellcheck
      - name: Run shellcheck
        run: find . -type f -iname "*.sh" -execdir shellcheck {} +
